# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom: keep disabled unless you verify cache compatibility
org.gradle.configuration-cache=false

# Fabric / Minecraft (26.3)
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod metadata — aligned with Fabric 26.1 port
mod_id=ironfurnaces
mod_name=Iron Furnaces
mod_license=Apache-2.0
mod_version=1.0.0
mod_group_id=ironfurnaces
maven_group=ironfurnaces
mod_authors=Astryxion
mod_credits=Astryxion, pizzatime, XenoMustache
mod_homepage=https://github.com/astryxion/Iron-Furnaces
mod_description=Iron Furnaces but newer - upgraded metal furnaces for faster smelting.
# JAR base name (without version)
archives_base_name=ironfurnacesfabric-26.3

# JEI — no 26.3 artifacts published yet; keep existing 26.2 compile-only API (not a new dependency)
jei_minecraft_version=26.2
jei_version=30.16.0.124

# Dependencies
fabric_api_version=0.160.5+26.3
